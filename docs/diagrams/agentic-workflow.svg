<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agentic-workflow-title agentic-workflow-desc" id="agentic-workflow-root">
        <title id="agentic-workflow-title">Support ticket triage agent workflow</title>
        <desc id="agentic-workflow-desc">LangGraph workflow in which a ticket from the CLI or API is PII-scrubbed and language-tagged, an LLM agent loops through four domain tools up to three calls, and a final LLM pass emits a guardrailed, audit-logged TriageDecision.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #agentic-workflow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #agentic-workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agentic-workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      #agentic-workflow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="agentic-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="agentic-workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="agentic-workflow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ Arrows (drawn first, behind nodes) ============ -->
        <line x1="152" y1="220" x2="180" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agentic-workflow-arrow)"/>
        <line x1="324" y1="220" x2="352" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agentic-workflow-arrow)"/>
        <line x1="496" y1="220" x2="528" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agentic-workflow-arrow)"/>
        <!-- check_next_step NO → finalize_triage -->
        <line x1="672" y1="220" x2="768" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agentic-workflow-arrow)"/>
        <!-- check_next_step YES → exec_tools -->
        <line x1="600" y1="268" x2="600" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agentic-workflow-arrow)"/>
        <!-- exec_tools → call_agent (loop back) -->
        <path d="M520,360 H432 Q424,360 424,352 V248" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#agentic-workflow-arrow)"/>
        <!-- exec_tools → tools -->
        <line x1="600" y1="388" x2="600" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agentic-workflow-arrow)"/>
        <!-- finalize_triage → guardrails → END -->
        <line x1="848" y1="248" x2="848" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agentic-workflow-arrow)"/>
        <line x1="848" y1="356" x2="848" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agentic-workflow-arrow)"/>

        <!-- ============ Arrow labels ============ -->
        <rect x="708" y="198" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="720" y="207" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="610" y="294" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="624" y="303" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="444" y="338" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="476" y="347" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOLMESSAGE</text>

        <rect x="610" y="414" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="634" y="423" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INVOKE</text>

        <!-- ============ Nodes ============ -->
        <!-- START oval -->
        <rect x="56" y="196" width="96" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="56" y="196" width="96" height="48" rx="20" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="104" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ticket</text>
        <text x="104" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CLI · API</text>

        <!-- prepare_context -->
        <rect x="180" y="192" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="252" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prepare context</text>
        <text x="252" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mask PII · TH/EN</text>

        <!-- call_agent (focal) -->
        <rect x="352" y="192" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="352" y="192" width="144" height="56" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="424" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Call agent</text>
        <text x="424" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LLM + bind_tools</text>

        <!-- check_next_step decision -->
        <polygon points="600,172 672,220 600,268 528,220" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="600" y="217" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tool calls &amp;</text>
        <text x="600" y="231" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">count &lt; 3?</text>

        <!-- exec_tools -->
        <rect x="520" y="332" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="600" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Execute tools</text>
        <text x="600" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tool_call_count += n</text>

        <!-- Domain tools -->
        <rect x="496" y="452" width="208" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="496" y="452" width="208" height="56" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="504" y="458" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="520" y="467" fill="#4f5d75" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS</text>
        <text x="600" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4 domain tools</text>
        <text x="600" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KB · status · billing · CRM</text>

        <!-- finalize_triage (focal) -->
        <rect x="768" y="192" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="192" width="160" height="56" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="848" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Finalize triage</text>
        <text x="848" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">structured output</text>

        <!-- Response guardrails -->
        <rect x="768" y="300" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="848" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Response guardrails</text>
        <text x="848" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">template · lang · format</text>

        <!-- END oval -->
        <rect x="776" y="412" width="144" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="776" y="412" width="144" height="48" rx="20" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="848" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TriageDecision</text>
        <text x="848" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">END · audit log</text>

        <!-- Annotation callouts -->

        <text x="56" y="420" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The loop is capped at three tool calls,</text>
        <text x="56" y="438" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">then the agent must commit to a decision.</text>

        <!-- ============ Legend ============ -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="572" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="72" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

        <rect x="172" y="572" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="204" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Graph step</text>

        <rect x="304" y="572" width="24" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="336" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">LLM call node</text>

        <polygon points="460,578 472,572 484,578 472,584" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="496" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Conditional edge</text>

        <rect x="624" y="572" width="24" height="12" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="656" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Tools</text>

        <line x1="728" y1="578" x2="756" y2="578" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#agentic-workflow-arrow)"/>
        <text x="764" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Loop back</text>
      </svg>
