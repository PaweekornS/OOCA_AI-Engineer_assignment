services:
  triage-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ooca-triage-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.0}
      - MAX_TOOL_CALLS=${MAX_TOOL_CALLS:-3}
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount logs directory to persist audit trail on host
      - ./logs:/app/logs
    command: ["--serve", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional service profile to run terminal benchmark tickets inside Docker
  triage-cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ooca-triage-cli
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.0}
      - MAX_TOOL_CALLS=${MAX_TOOL_CALLS:-3}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    command: ["--all"]
    profiles:
      - cli
